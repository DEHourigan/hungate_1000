    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 20px;
        }
        h1 { color: #333; margin: 0 0 10px 0; font-size: 28px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 20px; }
        .info { background: #e8f4f8; border-left: 4px solid #0288d1; padding: 12px; margin-bottom: 20px; border-radius: 4px; color: #01579b; font-size: 14px; }
        .loading { text-align: center; padding: 40px; color: #666; }
        .controls { margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .search-box { padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; flex: 1; min-width: 250px; }
        .per-page { padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        .table-wrapper { overflow-x: auto; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        thead { position: sticky; top: 0; z-index: 10; }
        th { background: #f0f0f0; font-weight: 600; padding: 10px 12px; text-align: left; border-bottom: 2px solid #ddd; color: #333; cursor: pointer; user-select: none; }
        th:hover { background: #e8e8e8; }
        td { padding: 8px 12px; border-bottom: 1px solid #eee; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        tbody tr:hover { background: #f8f8f8; }
        tbody tr:nth-child(even) { background: #fafafa; }
        .pagination { display: flex; justify-content: center; gap: 4px; margin-top: 15px; flex-wrap: wrap; }
        .pagination button { padding: 6px 10px; border: 1px solid #ddd; background: white; cursor: pointer; border-radius: 4px; font-size: 13px; }
        .pagination button:hover:not(:disabled) { background: #f0f0f0; }
        .pagination button.active { background: #0288d1; color: white; border-color: #0288d1; }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
        .info-row { text-align: center; padding: 10px; font-size: 12px; color: #666; }
    </style>

        let allData, filteredData, currentPage = 1, perPage = 25;
        
        function decompress(e) {
            const t = atob(e), n = new Uint8Array(t.length);
            for (let i = 0; i < t.length; i++) n[i] = t.charCodeAt(i);
            return JSON.parse(pako.inflate(n, {to: 'string'}))
        }
        
        function render() {
            const start = (currentPage - 1) * perPage, end = start + perPage;
            const page = filteredData.slice(start, end);
            const head = document.getElementById('table-head');
            head.innerHTML = '';
            if (allData.length) {
                const h = Object.keys(allData[0]);
                const tr = document.createElement('tr');
                h.forEach(col => {
                    const th = document.createElement('th');
                    th.textContent = col;
                    th.onclick = () => sort(col);
                    tr.appendChild(th);
                });
                head.appendChild(tr);
            }
            const body = document.getElementById('table-body');
            body.innerHTML = '';
            const h = allData.length ? Object.keys(allData[0]) : [];
            page.forEach(row => {
                const tr = document.createElement('tr');
                h.forEach(col => {
                    const td = document.createElement('td');
                    td.textContent = row[col] || '';
                    td.title = row[col] || '';
                    tr.appendChild(td);
                });
                body.appendChild(tr);
            });
            updatePagination();
            document.getElementById('showing-info').textContent = 
                `Showing ${(start+1).toLocaleString()} to ${Math.min(end, filteredData.length).toLocaleString()} of ${filteredData.length.toLocaleString()}`;
        }
        
        function sort(col) {
            filteredData.sort((a,b) => {
                let x = a[col], y = b[col];
                return x > y ? 1 : x < y ? -1 : 0;
            });
            currentPage = 1; render();
        }
        
        function filter(q) {
            q = q.toLowerCase();
            filteredData = allData.filter(r => Object.values(r).some(v => String(v).toLowerCase().includes(q)));
            currentPage = 1; render();
        }
        
        function updatePagination() {
            const n = Math.ceil(filteredData.length / perPage);
            const p = document.getElementById('pagination');
            p.innerHTML = '';
            for (let i = 1; i <= n; i++) {
                const b = document.createElement('button');
                b.textContent = i;
                b.className = i === currentPage ? 'active' : '';
                b.onclick = () => { currentPage = i; render(); };
                p.appendChild(b);
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            try {
                allData = decompress(EMBEDDED);
                filteredData = [...allData];
                document.getElementById('loading').style.display = 'none';
                document.getElementById('info-msg').innerHTML = `<strong>Loaded:</strong> ${allData.length.toLocaleString()} rows | <strong>Columns:</strong> ${Object.keys(allData[0] || {}).length}`;
                document.getElementById('table-section').style.display = 'block';
                document.getElementById('search-box').addEventListener('keyup', e => filter(e.target.value));
                document.getElementById('per-page').addEventListener('change', e => { perPage = parseInt(e.target.value); currentPage = 1; render(); });
                render();
            } catch(e) { document.getElementById('loading').textContent = 'Error: ' + e.message; }
        });
    </script>
